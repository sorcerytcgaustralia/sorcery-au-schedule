# Builds the site and deploys it to Cloudflare Workers static assets.
#
# - push to main: full production deploy at realmofoz.com
# - push to any other branch: uploads a preview version and prints its
#   *-realmofoz.<subdomain>.workers.dev URL in the job log, without
#   touching production
# - every 6 hours: rebuilds main so the build-time snapshot of the Google
#   Sheet stays fresh for first paint and search engines (the browser
#   re-reads the sheet on every visit regardless)
name: Deploy to Cloudflare

on:
  push:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the sheet parser
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build (fetches the Google Sheet snapshot first)
        run: npm run build

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Preview aliases must be lowercase letters, digits and hyphens, so a
      # branch like feature/new-board becomes feature-new-board.
      - name: Derive preview alias from the branch name
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: echo "alias=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/^-*//; s/-*$//' | cut -c1-40)" >> "$GITHUB_OUTPUT"
        id: preview

      - name: Upload preview version
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.preview.outputs.alias }}
